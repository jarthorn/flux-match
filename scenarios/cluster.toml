# Baseline clustering approach, with sites spread across geographic clusters in each balancing
# area. Undefined keys are taken from defaults.toml.

[selection]
strategy = "cluster"

[selection.cluster]
# Number of K-means clusters per balancing area. Reduced to the cell count in areas with
# fewer cells.
cluster_count = 10
# K-means random seed (0 to 2^32 - 1), so that runs are reproducible.
seed = 192837
# Number of K-means runs with different starting centroids; the best is kept.
n_init = 10
