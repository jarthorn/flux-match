# Baseline values inherited by every scenario for keys the scenario does not set.
# Not a runnable scenario: it does not define selection.strategy. There are still no
# defaults in code; each value a run uses comes from here or from the scenario file,
# and the resolved result is saved as config.toml in the run folder.

[fetch]
# Two-letter province codes as used by the CODERS API.
provinces = ["AB", "BC", "MB", "NB", "NL", "NS", "ON", "PE", "QC", "SK"]
# Calendar years of provincial_demand to download.
demand_years = [2018, 2019, 2020, 2021, 2022, 2023, 2024]
# Wind/solar capacity-factor tables are published per year; CODERS currently has 2021.
capacity_factor_years = [2025]

[fetch.ninja]
# Also download hourly wind output for every grid cell from renewables.ninja into data/ninja/
# (one request per cell, so a full download takes many hours; reruns resume where they stopped).
enabled = false
# Turbine used for every cell. Raw files are kept per model, height and year.
turbine_height = 105
turbine_model = "Vestas V150 4500"
# Seconds to wait between requests. NINJA allows 1 request per second.
request_sleep_s = 5
# Stop once this many requests were sent in the last hour, counting earlier runs (NINJA allows 50).
max_requests_per_hour = 50

[selection]
# Total solar capacity per balancing area, as a fraction of annual demand
solar_capacity_ratio = 2
# Total wind capacity per balancing area, as a fraction of annual demand
wind_capacity_ratio = 3

max_wind_capacity_mw_per_cell = 5000
max_solar_capacity_mw_per_cell = 5000

[selection.greedy]
# The ranking metric for selecting sites. One of ["median_daily_capacity", "annual_capacity"]
ranking_metric = "annual_capacity"

[dispatch]
# Calendar years of demand and weather data to dispatch.
dispatch_years = [2022, 2023, 2024]
# Battery state of charge at hour 1, as a fraction of energy capacity.
bess_initial_soc = 0.0
# Battery round-trip efficiency. Applied entirely on charge:
# energy stored = energy drawn * efficiency. Discharge is lossless.
bess_rte = 0.88
# Total battery storage capacity, as a fraction of average daily demand in most recent year
bess_capacity_ratio = 1
# Duration of bess storage in hours. Derive maximum power as capacity / duration.
bess_duration = 4
